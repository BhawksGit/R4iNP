<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R4xMP - Contact</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f44336;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f9f9f9;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    footer {
      background-color: #333;
      color: white;
      padding: 20px;
      text-align: center;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    .small-logo {
      max-width: 100px;
      height: auto;
    }

    .contact-form {
      margin-bottom: 20px;
    }

    .contact-form iframe {
      width: 100%;
      max-width: 640px;
      height: 856px;
      border: 0;
    }

    .back-button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #2196F3;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    /* Mobile-friendly adjustments */
    @media (max-width: 600px) {
      header {
        padding: 16px 12px;
      }

      h1 {
        font-size: 1.4rem;
      }

      main {
        margin: 12px;
        padding: 16px;
      }

      .contact-form iframe {
        height: 1200px;
      }

      .back-button {
        display: block;
        width: 100%;
        text-align: center;
      }

      footer {
        padding: 16px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <img src="r4_logo.png" alt="R4 Logo" class="small-logo">
    <h1>R4xMP - Contact</h1>
  </header>

  <main>
    <section class="contact-form">
      <h2>Contact Me</h2>
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd63X026OBXsieIicHHKDoFNnDsHrKibqNSv0fohB1qXCkqIQ/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading&hellip;</iframe>
    </section>
    <a href="index.html" class="back-button">Back</a>
  </main>

  <footer>
    <p>&copy; 2026 Hawknetics. All rights reserved. | <a href="privacy_policy.html">Privacy Policy</a> | Icons by <a href="https://icons8.com" target="_blank"
        rel="noopener noreferrer">Icons8</a></p>
  </footer>
</body>

</html>
